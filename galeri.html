    <main class="gallery-page">
      <section class="gallery-page-section">
        <div class="container">
          <div class="gallery-page-card">
            <div class="gallery-page-heading">
              <p class="gallery-page-kicker">GALERİ</p>
              <h1>Objektifimden</h1>
              <p>Yolculuklarımda ve günlük hayatta dikkatimi çeken manzara, şehir ve doğa karelerinden bazıları.</p>
            </div>
            <div id="galleryGrid" class="gallery-page-grid">
              <button class="gallery-page-item" type="button" data-full="image/camdayukarıbakankedi.jpeg" data-location="Bursa">
                <img src="image/camdayukarıbakankedi.jpeg" alt="Bursa'nın Kedileri" loading="lazy">
                <span class="gallery-location">Bursa</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/eskiotobüs.jpeg" data-location="Ankara">
                <img src="image/eskiotobüs.jpeg" alt="İstanbul manzarası" loading="lazy">
                <span class="gallery-location">Ankara</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/bandırmayelkenli.jpeg" data-location="Balıkesir">
                <img src="image/bandırmayelkenli.jpeg" alt="Balıkesir" loading="lazy">
                <span class="gallery-location">Balıkesir</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/istanbulklisie.jpeg" data-location="Sahil">
                <img src="image/istanbulklisie.jpeg" alt="Sahil manzarası" loading="lazy">
                <span class="gallery-location">İstanbul</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/bandırmanikahdairesi.jpeg" data-location="Balıkesir">
                <img src="image/bandırmanikahdairesi.jpeg" alt="Gün batımı" loading="lazy">
                <span class="gallery-location">Balıkesir</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/amerikawiconcin.jpeg" data-location="Amerika">
                <img src="image/amerikawiconcin.jpeg" alt="Doğa manzarası" loading="lazy">
                <span class="gallery-location">Amerika</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/bursametro.jpeg" data-location="Orman">
                <img src="image/bursametro.jpeg" alt="Orman manzarası" loading="lazy">
                <span class="gallery-location">Bursa</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/depreosyonkedi.jpeg" data-location="Gökyüzü">
                <img src="image/depreosyonkedi.jpeg" alt="Gökyüzü manzarası" loading="lazy">
                <span class="gallery-location">Balıksir</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/galatakulesi.jpeg" data-location="Yolculuk">
                <img src="image/galatakulesi.jpeg" alt="Yolculuk manzarası" loading="lazy">
                <span class="gallery-location">İstanbul</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/osmangaziköprüsü.jpeg" data-location="Deniz">
                <img src="image/osmangaziköprüsü.jpeg" alt="Deniz manzarası" loading="lazy">
                <span class="gallery-location">İstanbul</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/ormanlıatatürkbüstü.jpeg" data-location="Şehir">
                <img src="image/ormanlıatatürkbüstü.jpeg" alt="Şehir manzarası" loading="lazy">
                <span class="gallery-location">Erdek</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/erdekkedi.jpeg" data-location="Manzara">
                <img src="image/erdekkedi.jpeg" alt="Manzara fotoğrafı" loading="lazy">
                <span class="gallery-location">Erdek</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/günbatımı.jpeg" data-location="Bursa">
                <img src="image/günbatımı.jpeg" alt="Bursa manzarası" loading="lazy">
                <span class="gallery-location">Bandırma</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/cumalıkızık.jpeg" data-location="Seyahat">
                <img src="image/cumalıkızık.jpeg" alt="Seyahat fotoğrafı" loading="lazy">
                <span class="gallery-location">Bursa</span>
              </button>
              <button class="gallery-page-item" type="button" data-full="image/edincik.jpeg" data-location="Doğa">
                <img src="image/edincik.jpeg" alt="Doğa fotoğrafı" loading="lazy">
                <span class="gallery-location">Edincik</span>

            </div>
            <a href="index.html#anasayfa" class="gallery-home-link">
              Ana Sayfaya Geri Dön
              <span>→</span>
            </a>
          </div>
        </div>
      </section>
    </main>
    <div id="galleryLightbox" class="gallery-page-lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Tam ekran fotoğraf görüntüleyici">
      <div class="gallery-lightbox-toolbar">
        <a id="galleryDownload" class="gallery-lightbox-tool" href="#" download="" aria-label="Fotoğrafı indir" title="Fotoğrafı indir">
          <svg viewbox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            </path>
          </svg>
        </a>
        <button id="galleryClose" class="gallery-lightbox-tool gallery-lightbox-close" type="button" aria-label="Fotoğrafı kapat">×</button>
      </div>
      <button id="galleryLightboxPrev" class="gallery-lightbox-arrow gallery-lightbox-arrow-left" type="button" aria-label="Önceki fotoğraf">‹</button>
      <figure class="gallery-lightbox-content">
        <img id="galleryLightboxImage" src="" alt="">
        <figcaption class="gallery-lightbox-bottom">
          <span id="galleryLightboxLocation"></span>
          <span id="galleryLightboxCounter"></span>
        </figcaption>
      </figure>
      <button id="galleryLightboxNext" class="gallery-lightbox-arrow gallery-lightbox-arrow-right" type="button" aria-label="Sonraki fotoğraf">›</button>
    </div>
      <script>
  const root = document.documentElement;
  const themeToggle = document.getElementById("themeToggle");
  const themeIcon = document.getElementById("themeIcon");
  const savedTheme = localStorage.getItem("portfolio-theme");

  setTheme(savedTheme || "light");

  function setTheme(theme) {
    root.setAttribute("data-theme", theme);
    localStorage.setItem("portfolio-theme", theme);
    themeIcon.textContent = theme === "dark" ? "☀" : "☾";
  }

  themeToggle.addEventListener("click", () => {
    const currentTheme = root.getAttribute("data-theme");
    setTheme(currentTheme === "dark" ? "light" : "dark");
  });

  const menuToggle = document.getElementById("menuToggle");
  const mobileMenu = document.getElementById("mobileMenu");
  const mobileLinks = mobileMenu.querySelectorAll("a");

  function closeMobileMenu() {
    mobileMenu.classList.remove("open");
    menuToggle.classList.remove("open");
    menuToggle.setAttribute("aria-expanded", "false");
    menuToggle.setAttribute("aria-label", "Menüyü aç");
  }

  menuToggle.addEventListener("click", () => {
    const isOpen = mobileMenu.classList.toggle("open");
    menuToggle.classList.toggle("open", isOpen);
    menuToggle.setAttribute("aria-expanded", String(isOpen));
    menuToggle.setAttribute("aria-label", isOpen ? "Menüyü kapat" : "Menüyü aç");
  });

  mobileLinks.forEach((link) => {
    link.addEventListener("click", closeMobileMenu);
  });

  document.addEventListener("click", (event) => {
    const insideMenu = mobileMenu.contains(event.target);
    const insideButton = menuToggle.contains(event.target);

    if (!insideMenu && !insideButton) {
      closeMobileMenu();
    }
  });

  window.addEventListener("resize", () => {
    if (window.innerWidth > 900) {
      closeMobileMenu();
    }
  });

  const galleryItems = Array.from(
    document.querySelectorAll(".gallery-page-item")
  );
  const galleryLightbox = document.getElementById("galleryLightbox");
  const galleryLightboxImage = document.getElementById("galleryLightboxImage");
  const galleryLightboxLocation = document.getElementById("galleryLightboxLocation");
  const galleryLightboxCounter = document.getElementById("galleryLightboxCounter");
  const galleryDownload = document.getElementById("galleryDownload");
  const galleryClose = document.getElementById("galleryClose");
  const galleryLightboxPrev = document.getElementById("galleryLightboxPrev");
  const galleryLightboxNext = document.getElementById("galleryLightboxNext");

  let currentGalleryIndex = 0;
  let lastFocusedGalleryItem = null;

  function updateGalleryLightbox() {
    const currentItem = galleryItems[currentGalleryIndex];
    if (!currentItem) return;

    const image = currentItem.querySelector("img");
    if (!image) return;

    const fullImage = currentItem.dataset.full || image.getAttribute("src");
    const location = currentItem.dataset.location || "Konum belirtilmedi";

    galleryLightboxImage.src = fullImage;
    galleryLightboxImage.alt = image.alt || location;
    galleryLightboxLocation.textContent = location;
    galleryLightboxCounter.textContent =
      `${currentGalleryIndex + 1} / ${galleryItems.length}`;

    galleryDownload.href = fullImage;
    galleryDownload.setAttribute(
      "download",
      decodeURIComponent(fullImage.split("/").pop() || "fotograf.jpeg")
    );
  }

  function openGalleryLightbox(index) {
    currentGalleryIndex = index;
    lastFocusedGalleryItem = document.activeElement;
    updateGalleryLightbox();

    galleryLightbox.classList.add("open");
    galleryLightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    galleryClose.focus();
  }

  function closeGalleryLightbox() {
    galleryLightbox.classList.remove("open");
    galleryLightbox.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";

    if (
      lastFocusedGalleryItem &&
      typeof lastFocusedGalleryItem.focus === "function"
    ) {
      lastFocusedGalleryItem.focus();
    }
  }

  function showPreviousGalleryImage() {
    if (!galleryItems.length) return;

    currentGalleryIndex =
      (currentGalleryIndex - 1 + galleryItems.length) % galleryItems.length;

    updateGalleryLightbox();
  }

  function showNextGalleryImage() {
    if (!galleryItems.length) return;

    currentGalleryIndex =
      (currentGalleryIndex + 1) % galleryItems.length;

    updateGalleryLightbox();
  }

  galleryItems.forEach((item, index) => {
    item.addEventListener("click", () => {
      openGalleryLightbox(index);
    });
  });

  galleryClose.addEventListener("click", closeGalleryLightbox);
  galleryLightboxPrev.addEventListener("click", showPreviousGalleryImage);
  galleryLightboxNext.addEventListener("click", showNextGalleryImage);

  galleryLightbox.addEventListener("click", (event) => {
    if (event.target === galleryLightbox) {
      closeGalleryLightbox();
    }
  });

  galleryDownload.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();

    const currentItem = galleryItems[currentGalleryIndex];
    if (!currentItem) return;

    const image = currentItem.querySelector("img");
    if (!image) return;

    const imageUrl =
      currentItem.dataset.full || image.getAttribute("src");

    if (!imageUrl) return;

    const temporaryLink = document.createElement("a");
    temporaryLink.href = imageUrl;
    temporaryLink.download = decodeURIComponent(
      imageUrl.split("/").pop() || "fotograf.jpeg"
    );
    temporaryLink.style.display = "none";

    document.body.appendChild(temporaryLink);
    temporaryLink.click();
    temporaryLink.remove();
  });

  document.addEventListener("keydown", (event) => {
    const isOpen = galleryLightbox.classList.contains("open");
    if (!isOpen) return;

    if (event.key === "Escape") {
      closeGalleryLightbox();
    }

    if (event.key === "ArrowLeft") {
      showPreviousGalleryImage();
    }

    if (event.key === "ArrowRight") {
      showNextGalleryImage();
    }
  });

  let touchStartX = 0;
  let touchEndX = 0;

  galleryLightbox.addEventListener(
    "touchstart",
    (event) => {
      touchStartX = event.changedTouches[0].screenX;
    },
    { passive: true }
  );

  galleryLightbox.addEventListener(
    "touchend",
    (event) => {
      touchEndX = event.changedTouches[0].screenX;

      const difference = touchStartX - touchEndX;
      if (Math.abs(difference) < 45) return;

      if (difference > 0) {
        showNextGalleryImage();
      } else {
        showPreviousGalleryImage();
      }
    },
    { passive: true }
  );
  </script>
  </body>
</html>
